{{- range .Page.Params.fotos -}}
  {{- $name := . -}}
  {{- $res := $.Page.Resources.GetMatch $name -}}
  {{- $src := $name -}}
  {{- with $res -}}{{- $src = .RelPermalink -}}{{- end -}}
  <img src="{{ $src }}" alt="{{ $name }}" loading="lazy" style="max-width:100%;border-radius:8px;margin:0.4em 0;display:block;">
{{- end -}}

{{- $images := slice -}}
{{- range .Page.Params.fotos -}}
  {{- $name := . -}}
  {{- $res := $.Page.Resources.GetMatch $name -}}
  {{- $src := $name -}}
  {{- with $res -}}{{- $src = .RelPermalink -}}{{- end -}}
  {{- $images = $images | append $src -}}
{{- end -}}
<div class="fotos-galeria">
{{- range $images }}
  <img src="{{ . }}" alt="foto" loading="lazy" style="max-width:100%;border-radius:8px;margin:0.4em 0;display:block;cursor:zoom-in;">
{{- end }}
</div>

<script>
(function () {
  var overlay = null;
  var imgs = [];
  var idx = 0;

  function build() {
    overlay = document.createElement('div');
    overlay.className = 'lb-overlay';
    overlay.innerHTML =
      '<button class="lb-close" aria-label="Fechar">&times;</button>' +
      '<button class="lb-prev" aria-label="Anterior">&#8249;</button>' +
      '<img>' +
      '<button class="lb-next" aria-label="Seguinte">&#8250;</button>';
    document.body.appendChild(overlay);
    overlay.querySelector('.lb-close').addEventListener('click', close);
    overlay.querySelector('.lb-prev').addEventListener('click', function (e) { e.stopPropagation(); show(idx - 1); });
    overlay.querySelector('.lb-next').addEventListener('click', function (e) { e.stopPropagation(); show(idx + 1); });
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) close();
    });
  }

  function show(i) {
    idx = (i + imgs.length) % imgs.length;
    overlay.querySelector('img').src = imgs[idx].src;
  }

  function open(gallery, clicked) {
    imgs = Array.prototype.slice.call(gallery.querySelectorAll('img'));
    idx = imgs.indexOf(clicked);
    if (!overlay) build();
    overlay.style.display = 'flex';
    show(idx);
    document.addEventListener('keydown', onKey);
  }

  function close() {
    if (overlay) overlay.style.display = 'none';
    document.removeEventListener('keydown', onKey);
  }

  function onKey(e) {
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(idx - 1);
    else if (e.key === 'ArrowRight') show(idx + 1);
  }

  document.addEventListener('click', function (e) {
    var gallery = e.target.closest && e.target.closest('.fotos-galeria');
    if (gallery && e.target.tagName === 'IMG') {
      open(gallery, e.target);
    }
  });
})();

document.addEventListener('DOMContentLoaded', function () {
  (window.__mapaQueue || []).forEach(function (fn) { fn(); });
});
</script>

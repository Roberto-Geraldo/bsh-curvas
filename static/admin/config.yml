backend:
  name: github
  repo: Roberto-Geraldo/bsh-curvas
  branch: main
  base_url: https://bsh-curvas-oauth.bsh-curvas-oauth.workers.dev
  auth_endpoint: auth

site_url: https://roberto-geraldo.github.io/bsh-curvas/
display_url: https://roberto-geraldo.github.io/bsh-curvas/
publish_mode: simple
media_folder: ""
public_folder: ""

collections:
  - name: "aventuras"
    label: "Aventuras"
    label_singular: "Passeio"
    folder: "content/aventuras"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - label: "Detalhes"
        name: "params"
        widget: "object"
        required: false
        fields:
          - { label: "Distância", name: "distancia", widget: "string", required: false }
          - { label: "Duração", name: "duracao", widget: "string", required: false }
          - { label: "Partida", name: "partida", widget: "string", required: false }
          - { label: "Chegada", name: "chegada", widget: "string", required: false }
      - { label: "Texto", name: "body", widget: "markdown" }
      - { label: "Fotos", name: "fotos", widget: "fotos-galeria", required: false }
      - label: "Paragens (tascas, restaurantes, locais)"
        name: "paragens"
        widget: "list"
        required: false
        fields:
          - { label: "Nome", name: "nome", widget: "string" }
          - label: "Tipo"
            name: "tipo"
            widget: "select"
            default: "Tasca"
            options: ["Tasca", "Restaurante", "Café", "Miradouro", "Outro"]
          - { label: "Comentário", name: "comentario", widget: "text", required: false }

  - name: "sobre"
    label: "Sobre"
    files:
      - label: "Página Sobre"
        name: "sobre"
        file: "content/sobre.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Texto", name: "body", widget: "markdown" }
      - label: "Texto da Homepage"
        name: "home"
        file: "data/home.yaml"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Texto", name: "content", widget: "text" }
